<li class="recipe-card">
  <button
    type="button"
    class="recipe-card-open"
    [attr.aria-label]="accessibleName()"
    (click)="onOpen()"
  >
    <span class="recipe-card-title">{{ recipe().title }}</span>
    <span class="recipe-card-badge">{{ typeLabel() }}</span>
    <span class="recipe-card-counts">
      {{ recipe().ingredients.length }} ingredient{{
        recipe().ingredients.length === 1 ? '' : 's'
      }}, {{ recipe().steps.length }} step{{ recipe().steps.length === 1 ? '' : 's' }}
    </span>
  </button>
  <button
    type="button"
    class="button button-secondary recipe-card-delete"
    [attr.aria-label]="'Delete ' + recipe().title"
    (click)="onDelete()"
  >
    Delete
  </button>
</li>
